    };

    // List of scene keys in order (for cycling)
    const sceneKeys = Object.keys(spaceMap);
    let currentIndex = 0; // default to 'baobao'

    const prevBtn = document.getElementById('filter-prev');
    const nextBtn = document.getElementById('filter-next');

    // Helper: load a scene by key
    function loadScene(key) {
      const spaceId = spaceMap[key];
      if (spaceId && window.globalWorld) {
        window.globalWorld.spaces.loadSpace(spaceId);
        console.log(`➡️ Loading space: ${key} (${spaceId})`);
        // Update display
        // Optionally update active state (no carousel items, so just update index)
        currentIndex = sceneKeys.indexOf(key);
      } else {
        console.warn(`❌ Cannot load space: ${key} (globalWorld not ready or unknown)`);
        if (!window.globalWorld) {
          setTimeout(() => {
            if (window.globalWorld) {
              console.log('🔄 Retrying loadSpace after globalWorld became available');
              const retryId = spaceMap[key];
              if (retryId) window.globalWorld.spaces.loadSpace(retryId);
            }
          }, 500);
        }
      }
    }

    // Switch to previous/next scene
    function prevScene() {
      const newIndex = (currentIndex - 1 + sceneKeys.length) % sceneKeys.length;
      loadScene(sceneKeys[newIndex]);
    }
    function nextScene() {
      const newIndex = (currentIndex + 1) % sceneKeys.length;
      loadScene(sceneKeys[newIndex]);
    }

    // Event listeners
    if (prevBtn) prevBtn.addEventListener('click', prevScene);
    if (nextBtn) nextBtn.addEventListener('click', nextScene);

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prevScene();
      if (e.key === 'ArrowRight') nextScene();
    });
